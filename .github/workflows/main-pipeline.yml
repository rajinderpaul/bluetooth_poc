name: iOS CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:          # manual "Run" button in the Actions tab

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone | head

      - name: Build & test
        working-directory: bluetoothpoc
        run: |
          set -o pipefail
          xcodebuild \
            -project BluetoothManager.xcodeproj \
            -scheme BluetoothManager \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: bluetoothpoc/TestResults.xcresult
          retention-days: 7
